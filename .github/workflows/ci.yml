name: Pull request checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=mocked
      - name: Test Google sign-in gate with synthetic sessions
        run: npm run test:e2e -- --project=mocked tests/e2e/google-auth.spec.ts
        env:
          AUTH_MODE: google
          AUTH_GOOGLE_ID: synthetic
          AUTH_GOOGLE_SECRET: synthetic
          AUTH_SECRET: synthetic-session-secret-for-tests-only
          AUTH_URL: https://example.test
      - run: npm run build
      - run: npm run check:secrets

  fork-evaluation-blocked:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Report trusted-evaluation blocker
        run: |
          echo "::error title=Evaluation blocked::Fork changes never receive the model key."
          echo "BLOCKED: review the fork commit, move that exact revision to a maintainer-controlled branch, then open a new PR."
          exit 1
